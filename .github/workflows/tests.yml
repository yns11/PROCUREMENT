name: Procurement validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend scripts/generate_demo_v2.py scripts/init_db.py scripts/check_v2_browser.py scripts/uc run.py
      - run: python -m pytest backend/tests tests -q --ignore=backend/tests/test_grid_recalculation.py
  browser-and-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: client
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_v2_browser.py
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc
      - run: python -m pytest backend/tests/test_grid_recalculation.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
